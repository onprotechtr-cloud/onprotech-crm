<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONPROTECH CRM - Çevrimdışı</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      max-width: 400px;
      padding: 2rem;
      margin: 1rem;
    }
    .icon {
      width: 80px;
      height: 80px;
      background-color: #f97316;
      border-radius: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .icon svg {
      width: 40px;
      height: 40px;
      stroke: #ffffff;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    button {
      background-color: #f97316;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #ea580c;
    }
    .footer {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728M15.536 8.464a5 5 0 010 7.072M6.343 17.657a9 9 0 010-12.728m2.829 9.9a5 5 0 010-7.072M12 12h.01"></path>
      </svg>
    </div>
    <h1>İnternet Bağlantısı Yok</h1>
    <p>Şu anda çevrimdışısınız. ONPROTECH CRM uygulamasını kullanmak için lütfen internet bağlantınızı kontrol edin.</p>
    <button onclick="window.location.reload()">Yeniden Dene</button>
    <div class="footer">ONPROTECH CRM</div>
  </div>
</body>
</html>
